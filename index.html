<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lernplattform – Berufsprüfung Marketing & Verkauf</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=042">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const {useState, useEffect} = React;

/* ══════════════════════════════════════════════════════════
   Bücher-Katalog
   ══════════════════════════════════════════════════════════ */
const BOOKS = [
  {id:'rechnungswesen-uebungen',file:'rechnungswesen-uebungen.html',title:'Rechnungswesen – Aufgaben und Übungen',author:'Compendio-Autorenteam',year:2017,pages:280,color:'#3b82f6',chapters:16,exercises:159},
  {id:'rechnungswesen',file:'rechnungswesen.html',title:'Rechnungswesen für Marketing- und Verkaufsverantwortliche',author:'Robert Baumann',year:2017,pages:323,color:'#059669',chapters:15,exercises:191},
  {id:'selbstmanagement',file:'selbstmanagement.html',title:'Selbstmanagement für Marketing- und Verkaufsverantwortliche',author:'Geiger, Jäggi, Messi, Züger, Pifko',year:2017,pages:228,color:'#8b5cf6',chapters:15,exercises:87},
  {id:'projektmanagement',file:'projektmanagement.html',title:'Projektmanagement für Marketing- und Verkaufsverantwortliche',author:'Führer, Züger',year:2017,pages:142,color:'#d97706',chapters:15,exercises:43},
  {id:'marketingkonzept',file:'marketingkonzept.html',title:'Marketingkonzept, Marktanalyse und Marktleistung',author:'Friebe, Michel, Portmann, Reber, Schneider',year:2022,pages:280,color:'#dc2626',chapters:16,exercises:98},
  {id:'digitales-marketing',file:'digitales-marketing.html',title:'Digitales Marketing für Marketing- und Verkaufsverantwortliche',author:'Michael Klaas',year:2020,pages:166,color:'#0891b2',chapters:8,exercises:76},
  {id:'kommunikation-grundlagen',file:'kommunikation-grundlagen.html',title:'Grundlagen der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:167,color:'#be185d',chapters:11,exercises:83},
  {id:'kommunikation-instrumente',file:'kommunikation-instrumente.html',title:'Instrumente der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:198,color:'#9333ea',chapters:9,exercises:82},
  {id:'distribution',file:'distribution.html',title:'Distribution 3.0 für Marketing- und Verkaufsverantwortliche',author:'Bislin, Röösli',year:2023,pages:175,color:'#ea580c',chapters:10,exercises:81},
  {id:'verkaufsplanung',file:'verkaufsplanung.html',title:'Verkaufsplanung für Marketing- und Verkaufsverantwortliche',author:'Portmann, Meyer',year:2023,pages:231,color:'#4f46e5',chapters:10,exercises:101}
];

/* ══════════════════════════════════════════════════════════
   Progress aus localStorage
   ══════════════════════════════════════════════════════════ */
function getBookProgress(bookId){
  try{
    const data = JSON.parse(localStorage.getItem('lp-progress-'+bookId)||'{}');
    return Object.values(data).filter(p=>p&&p.done).length;
  }catch(e){return 0}
}

/* ══════════════════════════════════════════════════════════
   App
   ══════════════════════════════════════════════════════════ */
function App(){
  const [dark, setDark] = useState(()=>localStorage.getItem('lp-dark')==='1');

  useEffect(()=>{document.documentElement.className=dark?'dark':''},[dark]);

  function toggleDark(){
    setDark(d=>{localStorage.setItem('lp-dark',d?'0':'1');return !d})
  }

  const totalExercises = BOOKS.reduce((s,b)=>s+b.exercises,0);
  const totalDone = BOOKS.reduce((s,b)=>s+getBookProgress(b.id),0);
  const totalPct = totalExercises>0?Math.round(totalDone/totalExercises*100):0;
  const booksReady = BOOKS.filter(b=>b.exercises>0).length;
  const booksTotal = BOOKS.length;

  return e('div',null,
    /* ─── Hero ─── */
    e('div',{className:'hero'},
      e('div',{style:{position:'relative'}},
        e('div',{style:{fontSize:'.65rem',fontWeight:600,letterSpacing:'.25em',color:'rgba(255,255,255,.25)',textTransform:'uppercase',marginBottom:8}},'Berufsprüfung · Marketing & Verkauf'),
        e('h1',{className:'hero-title'},'Lernplattform'),
        e('p',{className:'hero-sub'},'Kompetenzorientiertes Wissen mit interaktiven Übungen'),
        e('div',{style:{display:'inline-block',marginTop:8,padding:'3px 10px',borderRadius:20,fontSize:'.65rem',fontWeight:600,letterSpacing:'.05em',background:'rgba(255,255,255,.1)',color:'rgba(255,255,255,.45)',border:'1px solid rgba(255,255,255,.08)'}},'v0.5.4-beta'),
        e('div',{style:{marginTop:6,fontSize:'.6rem',color:'rgba(255,255,255,.3)',maxWidth:340,lineHeight:1.4}},'Fix: Umlaute in RW-Lernmodus (ä/ö/ü statt ae/oe/ue)'),
        e('div',{className:'hero-stats'},
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},booksReady+'/'+booksTotal),
            e('div',{className:'hero-stat-label'},'Bücher')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalExercises),
            e('div',{className:'hero-stat-label'},'Aufgaben')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalPct+'%'),
            e('div',{className:'hero-stat-label'},'Fortschritt')
          )
        ),
        totalPct>0?e('div',{style:{maxWidth:300,margin:'16px auto 0'}},
          e('div',{className:'progress-bar',style:{maxWidth:'100%'}},
            e('div',{className:'progress-fill',style:{width:totalPct+'%',background:totalPct===100?'var(--green)':'var(--accent)'}})
          )
        ):null,
        e('button',{onClick:toggleDark,style:{position:'absolute',top:0,right:0,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.08)',color:'rgba(255,255,255,.5)',width:36,height:36,borderRadius:10,fontSize:16,cursor:'pointer'}},dark?'\u2600':'\u263d')
      )
    ),

    /* ─── Book Grid ─── */
    e('div',{className:'book-grid'},
      BOOKS.map(book=>{
        const done = getBookProgress(book.id);
        const pct = book.exercises>0?Math.round(done/book.exercises*100):0;
        const ready = book.exercises>0;
        return e('div',{
          key:book.id,
          className:'book-card',
          style:{opacity:ready?1:0.5,cursor:ready?'pointer':'default'},
          onClick:()=>{if(ready)window.location.href='buch.html?book='+book.id}
        },
          e('div',{className:'book-card-color',style:{background:book.color}}),
          e('div',{className:'book-card-body'},
            e('div',{className:'book-card-title'},book.title),
            e('div',{className:'book-card-author'},book.author+' ('+book.year+')'),
            e('div',{className:'book-card-meta'},
              ready
                ? book.chapters+' Kapitel · '+book.exercises+' Aufgaben'+(done>0?' · '+done+'/'+book.exercises+' erledigt':'')
                : 'Kommt bald...'
            ),
            ready?e('div',{className:'book-card-progress'},
              e('div',{className:'book-card-progress-fill',style:{width:pct+'%',background:pct===100?'var(--green)':book.color}})
            ):null
          )
        )
      })
    ),

    /* ─── Footer ─── */
    e('div',{className:'footer'},'Built by Leandro · Compendio Bildungsmedien')
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
