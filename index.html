<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lernplattform – Berufsprüfung Marketing & Verkauf</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=052">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="splash" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:linear-gradient(135deg,#3d2e1e,#1a1310,#352818);display:flex;align-items:center;justify-content:center;transition:opacity .8s ease;opacity:1">
<svg style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:.7;mix-blend-mode:overlay;pointer-events:none" xmlns="http://www.w3.org/2000/svg"><filter id="sg"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="5" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#sg)" opacity="0.3"/></svg>
<div id="splash-text" style="position:relative;z-index:2;font-family:Inter,sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:.14em;color:#ffffff;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease">BUILT BY LEANDRO</div>
</div>
<div id="root"></div>
<script>
(function(){
  var splash = document.getElementById('splash');
  var txt = document.getElementById('splash-text');

  function playCinematic(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Deep bass hit
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.2);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 2);

      // High shimmer
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(800, ctx.currentTime);
      osc2.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.8);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.3);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime);
      osc2.stop(ctx.currentTime + 2);

      // Sub rumble
      var osc3 = ctx.createOscillator();
      var gain3 = ctx.createGain();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(40, ctx.currentTime);
      gain3.gain.setValueAtTime(0.3, ctx.currentTime);
      gain3.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
      osc3.connect(gain3);
      gain3.connect(ctx.destination);
      osc3.start(ctx.currentTime);
      osc3.stop(ctx.currentTime + 1.5);
    }catch(e){}
  }

  // Click anywhere to unlock audio + start
  var started = false;
  function startSplash(){
    if(started) return;
    started = true;
    playCinematic();
    setTimeout(function(){ txt.style.opacity='1'; txt.style.transform='translateY(0)'; }, 100);
    setTimeout(function(){ splash.style.opacity='0'; }, 2400);
    setTimeout(function(){ splash.remove(); }, 3200);
  }

  // Only show splash on fresh session (not when navigating back from a book)
  if(sessionStorage.getItem('lp-splash-shown')){
    splash.remove();
    return;
  }
  sessionStorage.setItem('lp-splash-shown','1');

  // Try autoplay, fallback to click
  setTimeout(function(){
    if(!started) startSplash();
  }, 200);
  splash.addEventListener('click', startSplash);
})();
</script>
<script>
const e = React.createElement;
const {useState, useEffect} = React;

/* ══════════════════════════════════════════════════════════
   Bücher-Katalog
   ══════════════════════════════════════════════════════════ */
const BOOKS = [
  /* ── Upgraded ── */
  {id:'rechnungswesen-uebungen',file:'rechnungswesen-uebungen.html',title:'Rechnungswesen – Aufgaben und Übungen',author:'Compendio-Autorenteam',year:2017,pages:280,color:'#6b7280',chapters:16,exercises:159,upgraded:true},
  {id:'rechnungswesen',file:'rechnungswesen.html',title:'Rechnungswesen für Marketing- und Verkaufsverantwortliche',author:'Robert Baumann',year:2017,pages:323,color:'#4b5563',chapters:15,exercises:204,upgraded:true},
  {id:'kommunikation-grundlagen',file:'kommunikation-grundlagen.html',title:'Grundlagen der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:167,color:'#6b7280',chapters:11,exercises:137,upgraded:true},
  {id:'verkaufsplanung',file:'verkaufsplanung.html',title:'Verkaufsplanung für Marketing- und Verkaufsverantwortliche',author:'Portmann, Meyer',year:2023,pages:231,color:'#4b5563',chapters:10,exercises:101,upgraded:true},
  {id:'distribution',file:'distribution.html',title:'Distribution 3.0 für Marketing- und Verkaufsverantwortliche',author:'Bislin, Röösli',year:2023,pages:175,color:'#6b7280',chapters:10,exercises:80,upgraded:true},
  {id:'digitales-marketing',file:'digitales-marketing.html',title:'Digitales Marketing für Marketing- und Verkaufsverantwortliche',author:'Michael Klaas',year:2020,pages:166,color:'#4b5563',chapters:8,exercises:75,upgraded:true},
  {id:'kommunikation-instrumente',file:'kommunikation-instrumente.html',title:'Instrumente der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:198,color:'#6b7280',chapters:9,exercises:80,upgraded:true},
  {id:'marketingkonzept',file:'marketingkonzept.html',title:'Marketingkonzept, Marktanalyse und Marktleistung',author:'Friebe, Michel, Portmann, Reber, Schneider',year:2022,pages:280,color:'#4b5563',chapters:16,exercises:97,upgraded:true},
  /* ── In Bearbeitung ── */
  {id:'selbstmanagement',file:'selbstmanagement.html',title:'Selbstmanagement für Marketing- und Verkaufsverantwortliche',author:'Geiger, Jäggi, Messi, Züger, Pifko',year:2017,pages:228,color:'#6b7280',chapters:15,exercises:87},
  {id:'projektmanagement',file:'projektmanagement.html',title:'Projektmanagement für Marketing- und Verkaufsverantwortliche',author:'Führer, Züger',year:2017,pages:142,color:'#4b5563',chapters:15,exercises:43}
];

/* ══════════════════════════════════════════════════════════
   Progress aus localStorage
   ══════════════════════════════════════════════════════════ */
function getBookProgress(bookId){
  try{
    const data = JSON.parse(localStorage.getItem('lp-progress-'+bookId)||'{}');
    return Object.values(data).filter(p=>p&&p.done).length;
  }catch(e){return 0}
}

/* ══════════════════════════════════════════════════════════
   App
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════
   Globale Suche – lädt Buchdaten on-demand
   ══════════════════════════════════════════════════════════ */
var _searchCache = {};
var _searchLoading = false;

function loadAllBooks(callback){
  if(Object.keys(_searchCache).length===BOOKS.length){callback(_searchCache);return}
  if(_searchLoading)return;
  _searchLoading=true;
  var loaded=0;
  BOOKS.forEach(function(book){
    if(_searchCache[book.id]){loaded++;if(loaded===BOOKS.length){_searchLoading=false;callback(_searchCache)}return}
    var s=document.createElement('script');
    s.src='data/'+book.id+'.js?t='+Date.now();
    s.onload=function(){
      if(window.BOOK_DATA){_searchCache[book.id]={meta:book,data:window.BOOK_DATA};window.BOOK_DATA=null}
      loaded++;if(loaded===BOOKS.length){_searchLoading=false;callback(_searchCache)}
    };
    s.onerror=function(){loaded++;if(loaded===BOOKS.length){_searchLoading=false;callback(_searchCache)}};
    document.head.appendChild(s);
  });
}

function searchAllBooks(allData,query){
  var q=query.trim().toLowerCase();
  if(!q||q.length<2)return[];
  var results=[];
  Object.keys(allData).forEach(function(bookId){
    var entry=allData[bookId];
    var bd=entry.data;
    var bookResults=[];
    (bd.chapters||[]).forEach(function(ch){
      var hits=[];
      // Chapter title
      if((ch.title||'').toLowerCase().indexOf(q)>=0) hits.push({type:'kapitel',text:ch.title});
      // Exercises
      (ch.exercises||[]).forEach(function(ex){
        if((ex.q||'').toLowerCase().indexOf(q)>=0||(ex.instruction||'').toLowerCase().indexOf(q)>=0
          ||(ex.template||'').toLowerCase().indexOf(q)>=0
          ||(ex.statements||[]).some(function(s){return(s.s||'').toLowerCase().indexOf(q)>=0})
          ||(ex.options||[]).some(function(o){return(o||'').toLowerCase().indexOf(q)>=0})
          ||(ex.pairs||[]).some(function(p){return(p.l||'').toLowerCase().indexOf(q)>=0||(p.r||'').toLowerCase().indexOf(q)>=0})
          ||(ex.questions||[]).some(function(qn){return(qn.q||qn.text||'').toLowerCase().indexOf(q)>=0})
        ) hits.push({type:'übung',text:ex.q||'Aufgabe '+ex.id});
      });
      // Learning data
      if(ch.learningData&&ch.learningData.sections){
        ch.learningData.sections.forEach(function(sec){
          if((sec.title||'').toLowerCase().indexOf(q)>=0||(sec.content||'').toLowerCase().indexOf(q)>=0
            ||(sec.text||'').toLowerCase().indexOf(q)>=0||(sec.highlight||'').toLowerCase().indexOf(q)>=0
            ||(sec.items||[]).some(function(it){return(typeof it==='string'?it:JSON.stringify(it)).toLowerCase().indexOf(q)>=0})
            ||(sec.terms||[]).some(function(t){return(t.term||'').toLowerCase().indexOf(q)>=0||(t.def||'').toLowerCase().indexOf(q)>=0})
          ) hits.push({type:'lerninhalt',text:sec.title||sec.type});
        });
      }
      if(hits.length>0) bookResults.push({chapter:ch,hits:hits});
    });
    // Glossary
    var glossHits=[];
    (bd.glossary||[]).forEach(function(g){
      if((g.term||'').toLowerCase().indexOf(q)>=0||(g.def||'').toLowerCase().indexOf(q)>=0)
        glossHits.push(g);
    });
    if(bookResults.length>0||glossHits.length>0){
      results.push({bookId:bookId,meta:entry.meta,chapters:bookResults,glossary:glossHits});
    }
  });
  return results;
}

function App(){
  const [dark, setDark] = useState(()=>localStorage.getItem('lp-dark')==='1');
  const [searchQuery, setSearchQuery] = useState('');
  const [searchResults, setSearchResults] = useState(null);
  const [searchReady, setSearchReady] = useState(false);
  const [expandedBook, setExpandedBook] = useState(null);

  useEffect(()=>{document.documentElement.className=dark?'dark':''},[dark]);

  useEffect(()=>{
    if(searchQuery.length<2){setSearchResults(null);return}
    loadAllBooks(function(allData){
      setSearchReady(true);
      setSearchResults(searchAllBooks(allData,searchQuery));
    });
  },[searchQuery]);

  function toggleDark(){
    setDark(d=>{localStorage.setItem('lp-dark',d?'0':'1');return !d})
  }

  const totalExercises = BOOKS.reduce((s,b)=>s+b.exercises,0);
  const totalDone = BOOKS.reduce((s,b)=>s+getBookProgress(b.id),0);
  const totalPct = totalExercises>0?Math.round(totalDone/totalExercises*100):0;
  const booksReady = BOOKS.filter(b=>b.exercises>0).length;
  const booksTotal = BOOKS.length;

  return e('div',null,
    /* ─── Hero ─── */
    e('div',{className:'hero'},
      e('div',{style:{position:'relative'}},
        e('h1',{className:'hero-title',style:{letterSpacing:'.12em',fontSize:'1.4rem'}},'BUILT BY LEANDRO'),
        e('div',{style:{display:'inline-block',marginTop:10,padding:'2px 10px',borderRadius:4,fontSize:'.6rem',fontWeight:600,letterSpacing:'.05em',background:'rgba(255,255,255,.08)',color:'var(--hero-sub)',border:'1px solid rgba(255,255,255,.1)'}},'v0.7.11-beta'),
        e('div',{className:'hero-stats'},
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},booksReady+'/'+booksTotal),
            e('div',{className:'hero-stat-label'},'Bücher')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalDone+'/'+totalExercises),
            e('div',{className:'hero-stat-label'},'Erledigt')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalPct+'%'),
            e('div',{className:'hero-stat-label'},'Gesamt')
          )
        ),
        totalPct>0?e('div',{style:{maxWidth:300,margin:'16px auto 0'}},
          e('div',{className:'progress-bar',style:{maxWidth:'100%'}},
            e('div',{className:'progress-fill',style:{width:totalPct+'%',background:totalPct===100?'var(--green)':'linear-gradient(90deg,#5c3d1e,#8b6a3e)'}})
          )
        ):null,
        e('button',{onClick:toggleDark,style:{marginTop:16,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.1)',color:'var(--hero-sub)',padding:'4px 10px',borderRadius:6,fontSize:'.6rem',fontWeight:600,cursor:'pointer',letterSpacing:'.03em'}},dark?'LICHT':'DUNKEL')
      )
    ),

    /* ─── Global Search ─── */
    e('div',{style:{maxWidth:800,margin:'0 auto',padding:'0 20px'}},
      e('div',{style:{position:'relative',marginBottom:16}},
        e('input',{
          type:'text',value:searchQuery,
          onChange:function(ev){setSearchQuery(ev.target.value)},
          placeholder:'\uD83D\uDD0D Alle Bücher durchsuchen – Kapitel, Übungen, Begriffe\u2026',
          style:{width:'100%',padding:'12px 40px 12px 16px',borderRadius:10,border:'1px solid var(--border)',background:'var(--card)',color:'var(--text)',fontSize:'.9rem',outline:'none',boxSizing:'border-box'}
        }),
        searchQuery.length>0?e('span',{
          onClick:function(){setSearchQuery('')},
          style:{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',cursor:'pointer',opacity:.4,fontSize:'.9rem'}
        },'\u2715'):null
      ),
      searchResults&&searchQuery.length>=2?e('div',{style:{marginBottom:24}},
        searchResults.length===0?e('div',{style:{padding:'20px',color:'var(--text2)',fontSize:'.88rem',textAlign:'center',background:'var(--card)',borderRadius:10,border:'1px solid var(--border)'}},
          'Keine Ergebnisse f\u00FCr \u00AB'+searchQuery+'\u00BB'
        ):
        e('div',null,
          e('div',{style:{fontSize:'.75rem',fontWeight:600,color:'var(--text2)',marginBottom:10,letterSpacing:'.03em'}},
            searchResults.reduce(function(s,r){return s+r.chapters.length},0)+' Kapitel in '+searchResults.length+' B\u00FCcher'+
            (searchResults.some(function(r){return r.glossary.length>0})?' + Glossar-Treffer':'')
          ),
          searchResults.map(function(r,i){
            var isExpanded=expandedBook===r.bookId;
            var totalHits=r.chapters.reduce(function(s,c){return s+c.hits.length},0)+r.glossary.length;
            return e('div',{key:i,style:{marginBottom:8,borderRadius:10,background:'var(--card)',border:'1px solid var(--border)',overflow:'hidden'}},
              e('div',{
                onClick:function(){setExpandedBook(isExpanded?null:r.bookId)},
                style:{padding:'12px 16px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}
              },
                e('div',null,
                  e('div',{style:{fontWeight:700,fontSize:'.9rem',color:'var(--text)'}},r.meta.title),
                  e('div',{style:{fontSize:'.78rem',color:'var(--text2)',marginTop:2}},
                    totalHits+' Treffer in '+r.chapters.length+' Kapitel'+(r.glossary.length>0?', '+r.glossary.length+' Glossar':'')
                  )
                ),
                e('span',{style:{fontSize:'.7rem',opacity:.5,transform:isExpanded?'rotate(180deg)':'',transition:'transform .2s'}},'\u25BC')
              ),
              isExpanded?e('div',{style:{padding:'0 16px 14px',borderTop:'1px solid var(--border)'}},
                r.chapters.map(function(ch,j){
                  return e('div',{key:j,style:{marginTop:10}},
                    e('div',{
                      style:{fontWeight:600,fontSize:'.82rem',color:'var(--accent)',cursor:'pointer'},
                      onClick:function(){window.location.href='buch.html?book='+r.bookId}
                    },ch.chapter.num+' \u2013 '+ch.chapter.title),
                    ch.hits.map(function(h,k){
                      return e('div',{key:k,style:{fontSize:'.78rem',color:'var(--text2)',marginTop:2,paddingLeft:12}},
                        e('span',{style:{opacity:.5,marginRight:6}},
                          h.type==='\u00fcbung'?'\u270F':h.type==='lerninhalt'?'\uD83D\uDCD6':'\uD83D\uDCCC'
                        ),
                        h.text
                      )
                    })
                  )
                }),
                r.glossary.length>0?e('div',{style:{marginTop:10,paddingTop:8,borderTop:'1px solid var(--border)'}},
                  e('div',{style:{fontWeight:600,fontSize:'.82rem',color:'var(--accent)',marginBottom:4}},'Glossar'),
                  r.glossary.map(function(g,k){
                    return e('div',{key:k,style:{fontSize:'.78rem',color:'var(--text2)',marginTop:2,paddingLeft:12}},
                      e('strong',null,g.term+': '),g.def
                    )
                  })
                ):null
              ):null
            )
          })
        )
      ):null
    ),

    /* ─── Book Grid ─── */
    e('div',{className:'book-grid'},
      BOOKS.map(book=>{
        const done = getBookProgress(book.id);
        const pct = book.exercises>0?Math.round(done/book.exercises*100):0;
        const ready = book.exercises>0;
        const isUpgraded = book.upgraded;
        return e('div',{
          key:book.id,
          className:'book-card'+(isUpgraded?'':' book-card--basic'),
          style:{opacity:ready?(isUpgraded?1:0.45):0.3,cursor:ready?'pointer':'default'},
          onClick:()=>{if(ready)window.location.href='buch.html?book='+book.id}
        },
          e('div',{className:'book-card-color',style:{background:book.color}}),
          e('div',{className:'book-card-body'},
            isUpgraded?null:e('div',{style:{display:'inline-block',marginBottom:6,padding:'2px 8px',borderRadius:4,fontSize:'.55rem',fontWeight:600,letterSpacing:'.04em',background:'rgba(180,83,9,.12)',color:'var(--amber)',border:'1px solid rgba(180,83,9,.18)'}},'WIRD AUSGEBAUT'),
            e('div',{className:'book-card-title'},book.title),
            e('div',{className:'book-card-author'},book.author+' ('+book.year+')'),
            e('div',{className:'book-card-meta'},
              ready
                ? book.chapters+' Kapitel · '+book.exercises+' Aufgaben'+(done>0?' · '+done+'/'+book.exercises+' erledigt':'')
                : 'Kommt bald...'
            ),
            ready?e('div',{className:'book-card-progress'},
              e('div',{className:'book-card-progress-fill',style:{width:pct+'%',background:pct===100?'var(--green)':'var(--text2)'}})
            ):null
          )
        )
      })
    ),

    /* ─── Footer ─── */
    e('div',{className:'footer'},e('span',{style:{fontWeight:700,letterSpacing:'.1em'}},'BUILT BY LEANDRO'))
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
