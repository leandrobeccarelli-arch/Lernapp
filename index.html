<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lernplattform – Berufsprüfung Marketing & Verkauf</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=045">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="splash" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:linear-gradient(135deg,#e8ecf1,#dfe4ec);display:flex;align-items:center;justify-content:center;transition:opacity .6s ease;opacity:1">
<div style="text-align:center">
<div id="splash-text" style="font-family:Inter,sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:.14em;color:#18181b;opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease">BUILT BY LEANDRO</div>
<div id="splash-line" style="width:0;height:2px;background:#4b5563;margin:14px auto 0;transition:width .6s ease .3s;border-radius:1px"></div>
</div>
</div>
<div id="root"></div>
<script>
(function(){
  var splash = document.getElementById('splash');
  var txt = document.getElementById('splash-text');
  var line = document.getElementById('splash-line');
  // Animate in
  setTimeout(function(){ txt.style.opacity='1'; txt.style.transform='translateY(0)'; line.style.width='60px'; }, 100);
  // Fade out
  setTimeout(function(){ splash.style.opacity='0'; }, 1800);
  // Remove
  setTimeout(function(){ splash.remove(); }, 2400);
})();
</script>
<script>
const e = React.createElement;
const {useState, useEffect} = React;

/* ══════════════════════════════════════════════════════════
   Bücher-Katalog
   ══════════════════════════════════════════════════════════ */
const BOOKS = [
  {id:'rechnungswesen-uebungen',file:'rechnungswesen-uebungen.html',title:'Rechnungswesen – Aufgaben und Übungen',author:'Compendio-Autorenteam',year:2017,pages:280,color:'#6b7280',chapters:16,exercises:159},
  {id:'rechnungswesen',file:'rechnungswesen.html',title:'Rechnungswesen für Marketing- und Verkaufsverantwortliche',author:'Robert Baumann',year:2017,pages:323,color:'#4b5563',chapters:15,exercises:204},
  {id:'selbstmanagement',file:'selbstmanagement.html',title:'Selbstmanagement für Marketing- und Verkaufsverantwortliche',author:'Geiger, Jäggi, Messi, Züger, Pifko',year:2017,pages:228,color:'#6b7280',chapters:15,exercises:87},
  {id:'projektmanagement',file:'projektmanagement.html',title:'Projektmanagement für Marketing- und Verkaufsverantwortliche',author:'Führer, Züger',year:2017,pages:142,color:'#4b5563',chapters:15,exercises:43},
  {id:'marketingkonzept',file:'marketingkonzept.html',title:'Marketingkonzept, Marktanalyse und Marktleistung',author:'Friebe, Michel, Portmann, Reber, Schneider',year:2022,pages:280,color:'#6b7280',chapters:16,exercises:98},
  {id:'digitales-marketing',file:'digitales-marketing.html',title:'Digitales Marketing für Marketing- und Verkaufsverantwortliche',author:'Michael Klaas',year:2020,pages:166,color:'#4b5563',chapters:8,exercises:76},
  {id:'kommunikation-grundlagen',file:'kommunikation-grundlagen.html',title:'Grundlagen der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:167,color:'#6b7280',chapters:11,exercises:83},
  {id:'kommunikation-instrumente',file:'kommunikation-instrumente.html',title:'Instrumente der Kommunikation für Marketing- und Verkaufsverantwortliche',author:'Markus Aerni',year:2023,pages:198,color:'#4b5563',chapters:9,exercises:82},
  {id:'distribution',file:'distribution.html',title:'Distribution 3.0 für Marketing- und Verkaufsverantwortliche',author:'Bislin, Röösli',year:2023,pages:175,color:'#6b7280',chapters:10,exercises:81},
  {id:'verkaufsplanung',file:'verkaufsplanung.html',title:'Verkaufsplanung für Marketing- und Verkaufsverantwortliche',author:'Portmann, Meyer',year:2023,pages:231,color:'#4b5563',chapters:10,exercises:101}
];

/* ══════════════════════════════════════════════════════════
   Progress aus localStorage
   ══════════════════════════════════════════════════════════ */
function getBookProgress(bookId){
  try{
    const data = JSON.parse(localStorage.getItem('lp-progress-'+bookId)||'{}');
    return Object.values(data).filter(p=>p&&p.done).length;
  }catch(e){return 0}
}

/* ══════════════════════════════════════════════════════════
   App
   ══════════════════════════════════════════════════════════ */
function App(){
  const [dark, setDark] = useState(()=>localStorage.getItem('lp-dark')==='1');

  useEffect(()=>{document.documentElement.className=dark?'dark':''},[dark]);

  function toggleDark(){
    setDark(d=>{localStorage.setItem('lp-dark',d?'0':'1');return !d})
  }

  const totalExercises = BOOKS.reduce((s,b)=>s+b.exercises,0);
  const totalDone = BOOKS.reduce((s,b)=>s+getBookProgress(b.id),0);
  const totalPct = totalExercises>0?Math.round(totalDone/totalExercises*100):0;
  const booksReady = BOOKS.filter(b=>b.exercises>0).length;
  const booksTotal = BOOKS.length;

  return e('div',null,
    /* ─── Hero ─── */
    e('div',{className:'hero'},
      e('div',{style:{position:'relative'}},
        e('h1',{className:'hero-title',style:{letterSpacing:'.12em',fontSize:'1.4rem'}},'BUILT BY LEANDRO'),
        e('div',{style:{display:'inline-block',marginTop:10,padding:'2px 10px',borderRadius:4,fontSize:'.6rem',fontWeight:600,letterSpacing:'.05em',background:'rgba(0,0,0,.05)',color:'var(--hero-sub)',border:'1px solid rgba(0,0,0,.06)'}},'v0.6.3-beta'),
        e('div',{className:'hero-stats'},
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},booksReady+'/'+booksTotal),
            e('div',{className:'hero-stat-label'},'Bücher')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalDone+'/'+totalExercises),
            e('div',{className:'hero-stat-label'},'Erledigt')
          ),
          e('div',{className:'hero-stat'},
            e('div',{className:'hero-stat-val'},totalPct+'%'),
            e('div',{className:'hero-stat-label'},'Gesamt')
          )
        ),
        totalPct>0?e('div',{style:{maxWidth:300,margin:'16px auto 0'}},
          e('div',{className:'progress-bar',style:{maxWidth:'100%'}},
            e('div',{className:'progress-fill',style:{width:totalPct+'%',background:totalPct===100?'var(--green)':'linear-gradient(90deg,var(--accent),#6366f1)'}})
          )
        ):null,
        e('button',{onClick:toggleDark,style:{position:'absolute',top:0,right:0,background:'rgba(0,0,0,.04)',border:'1px solid rgba(0,0,0,.06)',color:'var(--hero-sub)',width:32,height:32,borderRadius:6,fontSize:14,cursor:'pointer'}},dark?'\u2600':'\u263d')
      )
    ),

    /* ─── Book Grid ─── */
    e('div',{className:'book-grid'},
      BOOKS.map(book=>{
        const done = getBookProgress(book.id);
        const pct = book.exercises>0?Math.round(done/book.exercises*100):0;
        const ready = book.exercises>0;
        return e('div',{
          key:book.id,
          className:'book-card',
          style:{opacity:ready?1:0.5,cursor:ready?'pointer':'default'},
          onClick:()=>{if(ready)window.location.href='buch.html?book='+book.id}
        },
          e('div',{className:'book-card-color',style:{background:book.color}}),
          e('div',{className:'book-card-body'},
            e('div',{className:'book-card-title'},book.title),
            e('div',{className:'book-card-author'},book.author+' ('+book.year+')'),
            e('div',{className:'book-card-meta'},
              ready
                ? book.chapters+' Kapitel · '+book.exercises+' Aufgaben'+(done>0?' · '+done+'/'+book.exercises+' erledigt':'')
                : 'Kommt bald...'
            ),
            ready?e('div',{className:'book-card-progress'},
              e('div',{className:'book-card-progress-fill',style:{width:pct+'%',background:pct===100?'var(--green)':'var(--text2)'}})
            ):null
          )
        )
      })
    ),

    /* ─── Footer ─── */
    e('div',{className:'footer'},e('span',{style:{fontWeight:700,letterSpacing:'.1em'}},'BUILT BY LEANDRO'))
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
