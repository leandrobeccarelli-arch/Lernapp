<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SVG Test</title></head>
<body>
<h2>Test 1: Inline SVG</h2>
<div style="border:1px solid red;padding:10px;">
<svg viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif"><rect x="0" y="25" width="100" height="50" rx="8" fill="#4f46e5"/><text x="50" y="55" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Test</text></svg>
</div>

<h2>Test 2: dangerouslySetInnerHTML via React</h2>
<div id="react-test" style="border:1px solid blue;padding:10px;"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
var svgString = '<svg viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif"><rect x="0" y="25" width="100" height="50" rx="8" fill="#4f46e5"/><text x="50" y="55" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">React SVG</text></svg>';

var root = ReactDOM.createRoot(document.getElementById('react-test'));
root.render(React.createElement('div', { dangerouslySetInnerHTML: { __html: svgString } }));
</script>

<h2>Test 3: Load actual data file</h2>
<div id="data-test" style="border:1px solid green;padding:10px;"></div>
<script>
var s = document.createElement('script');
s.src = 'data/verkaufsplanung.js?t=' + Date.now();
s.onload = function() {
  var data = window.BOOK_DATA;
  var ch1 = data.chapters[0];
  var svgSections = ch1.learningData.sections.filter(function(s) { return s.type === 'svg'; });
  var el = document.getElementById('data-test');
  el.innerHTML = '<p>Found ' + svgSections.length + ' SVG sections in Ch1</p>';
  svgSections.forEach(function(sec) {
    el.innerHTML += '<p><b>' + sec.title + '</b></p>';
    el.innerHTML += '<p>Has svg property: ' + (!!sec.svg) + '</p>';
    el.innerHTML += '<p>SVG length: ' + (sec.svg ? sec.svg.length : 0) + '</p>';
    if (sec.svg) {
      el.innerHTML += '<div style="border:1px solid orange;padding:5px">' + sec.svg + '</div>';
    }
  });
};
document.head.appendChild(s);
</script>
</body>
</html>
